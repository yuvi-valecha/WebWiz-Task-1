<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZZIE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./output.css">

</head>
<body class="bg-black min-h-screen w-[780px] md:w-auto flex items-center justify-center text-yellow-500">
    <div>
        <header>
            <div class="flex flex-col justify-center">
                <div class="flex justify-between mt-56 mx-7 mb-5 md:mt-12 md:mx-0 md:mb-0">
                    <div class="text-yellow-300 text-7xl md:text-4xl text-shadow-lg text-shadow-amber-300">QUIZ<span class="text-gray-100">ZIE</span></div>
                    <div class="text-xl md:text-sm ml-90 mt-1 border border-gray-400 p-2 pt-4 md:pt-2 border-t-4">JEE  Mains</div>  
                </div>
                <!-- line between header and main section -->
                <div class="h-1 w-3xl mt-8 bg-gray-300"></div>
            </div>
            
        </header>

        <main>
            <section class="bg-slate-900 h-screen md:h-auto  w-auto mt-24 md:mt-12 border-t-2 border-green-400 flex flex-col items-center justify-center" id="landing-page">
                <div class="py-10 px-24 md:px-50">
                    <div class="mb-16 md:mb-0 text-9xl md:text-6xl text-amber-500 flex justify-center"><i class="fa-solid fa-bolt"></i></div>
                    <div class="text-6xl md:text-4xl text-yellow-300 text-shadow-sm text-shadow-amber-200 font-bold flex justify-center mt-8">KNOWLEDGE CHECK</div>
                    <div class="mt-5 text-gray-400 flex flex-col items-center text-3xl md:text-lg">
                        <div>Challenge yourself with 10 Questions</div>
                        <div>To check your JEE prep</div>
                    </div>
                    <div>
                        <div class="mt-24 md:mt-12 text-6xl md:text-3xl font-bold scale-y-150 text-green-400 text-shadow-sm text-shadow-green-400 flex justify-around">
                            <p>10</p>
                            <p class="mx-8 ml-12">4</p>
                            <p><i class="fa-solid fa-infinity"></i></p>
                        </div>
                        <div class="my-2 text-2xl md:text-xs text-gray-400 flex justify-around ">
                            <p class="mt-3">QUESTIONS</p>
                            <p class="mx-8 mt-3">CHOICES EACH</p>
                            <p class="mt-3">ATTEMPTS</p>
                        </div>
                    </div>
                    <div class="mt-24 md:mt-14 mb-4  flex justify-center">
                        <button id="start-btn" class="bg-yellow-300 py-8 md:py-4 px-16 text-black text-4xl md:text-lg font-semibold rounded-md hover:cursor-pointer shadow-2xl hover:shadow-yellow-200 transition-all duration-300 ease-in-out hover:-translate-y-1">
                            <span>START QUIZ</span>
                            <span><i class="fa-solid fa-arrow-right"></i></span>
                        </button>
                    </div>
                </div>

                <div>

                </div>
            </section>
            <section class="bg-slate-900 h-screen md:h-auto max-w-[765px] mt-24 md:mt-12 border-t-2 border-green-400 hidden flex-col items-center justify-center flex-wrap" id="quiz-screen">
                <div class="pb-1">
                    <div class="flex justify-between px-7 pt-5 text-4xl md:text-sm">
                        <p class="text-gray-300">QUESTION <span class="text-yellow-300" id="ques-num">3</span> / 10</p>
                        <p class="text-gray-300">SCORE: <span class="text-yellow-300" id="score"></span></p>
                    </div>
                    <div class="h-0.5 w-[710px] bg-gray-600 ml-7 mt-3 flex justify-center"></div>
                    <div class="text-2xl md:text-xs bg-green-400/20 tracking-widest font-bold text-green-300 w-fit px-2 py-1 mt-7 ml-7 border border-green-300" id="subject"></div>
                    <div class="text-3xl md:text-2xl ml-7 pt-7 text-gray-200" id="question"></div>
                    <div class="mt-7 pl-10 text-3xl md:text-lg">
                        <div id="option-A" class="border border-gray-500 pl-3 mr-6 bg-gray-800 h-14 py-2 md:py-4 rounded hover:cursor-pointer hover:border-yellow-300 hover:border-l-5 transition-all duration-300 ease-in-out hover:translate-x-1">
                            <p class="ml-3 text-gray-200"><span class="border-1 border-gray-500  rounded mr-5 pl-2 pr-1 py-0.5">A </span><span id="option-a"></span></p>
                        </div>
                        <div id="option-B" class="border border-gray-500 pl-3 my-4 mr-6 bg-gray-800 h-14 py-2 md:py-4 rounded hover:cursor-pointer hover:border-yellow-300 hover:border-l-5 transition-all duration-300 ease-in-out hover:translate-x-1">
                            <p class="ml-3 text-gray-200"><span class="border-1 border-gray-500  rounded mr-5 pl-2 pr-1 py-0.5">B </span><span id="option-b"></span></p>
                        </div>
                        <div id="option-C" class="border border-gray-500 pl-3 mr-6 bg-gray-800 h-14 py-2 md:py-4 rounded hover:cursor-pointer hover:border-yellow-300 hover:border-l-5 transition-all duration-300 ease-in-out hover:translate-x-1">
                            <p class="ml-3 text-gray-200"><span class="border-1 border-gray-500  rounded mr-5 pl-2 pr-1 py-0.5">C </span><span id="option-c"></span></p>
                        </div>
                        <div id="option-D" class="border border-gray-500 pl-3 my-4 mr-6 bg-gray-800 h-14 py-2 md:py-4 rounded hover:cursor-pointer hover:border-yellow-300 hover:border-l-5 transition-all duration-300 ease-in-out hover:translate-x-1">
                            <p class="ml-3 text-gray-200"><span class="border-1 border-gray-500  rounded mr-5 pl-2 pr-1 py-0.5">D </span><span id="option-d"></span></p>
                        </div>
                    </div>
                    <div class="text-black ml-6 mr-6 mt-20 md:mt-10 mb-10 flex justify-between">
                        <button id="prev-btn" class="bg-yellow-300 py-2 px-4 text-black font-semibold rounded-md hover:cursor-pointer shadow-2xl hover:shadow-yellow-200 transition-all duration-300 ease-in-out hover:-translate-y-1">
                            <p class="text-3xl md:text-lg px-10 py-3">PREVIOUS</p>
                        </button>
                        <button id="check-btn" class="bg-yellow-300 py-2 px-4 text-black font-semibold rounded-md hover:cursor-pointer shadow-2xl hover:shadow-yellow-200 transition-all duration-300 ease-in-out hover:-translate-y-1">
                            <p class="text-3xl md:text-lg px-10 py-3">Check</p>
                        </button>
                        <button id="next-btn" class="bg-yellow-300 py-2 px-6 text-black font-semibold rounded-md hover:cursor-pointer shadow-2xl hover:shadow-yellow-200 transition-all duration-300 ease-in-out hover:-translate-y-1">
                            <p class="text-3xl md:text-lg px-10 py-3">NEXT</p>
                            
                        </button>
                        <button id="finish-btn" class="bg-yellow-300 py-2 px-6 text-black font-semibold rounded-md hover:cursor-pointer shadow-2xl hover:shadow-yellow-200 transition-all duration-300 ease-in-out hover:-translate-y-1">
                            <p class="text-3xl md:text-lg px-10 py-3">FINISH</p>  
                        </button>
                    </div>
                </div>
            </section>

            <section class="bg-slate-900 h-screen md:h-auto w-[765px] mt-24 md:mt-12 border-t-2 border-green-400 justify-center items-center flex-wrap hidden" id="result-screen">
                <div class="pb-1">
                    <div class="flex justify-center px-7">
                        <p class="text-gray-300 text-7xl md:text-5xl mt-10">QUIZ RESULT<span class="text-yellow-300" id="score"></span></p>
                    </div>
                    <div class="h-0.5 w-[710px] bg-gray-600 ml-7 mt-3 flex justify-center"></div>
                    <div class="flex justify-between px-7 pt-12">
                        <div class="">
                            <!-- left part -->
                             <p class="text-7xl md:text-5xl text-yellow-300 font-bold">QUIZ COMPLETED!</p>
                             <div>
                                <p class="text-5xl md:text-3xl pt-10 md:pt-5 text-gray-300">YOUR SCORE</p>
                                <p class="pt-5 md:pt-2 pl-3 text-6xl md:text-4xl font-bold text-green-400"><span id="final-score"></span> / 10</p>
                             </div>
                             <p id="message" class="text-gray-200 pt-12 md:pt-6 text-4xl md:text-xl">MESSAGE</p>
                        </div>

                        <div>
                            <!-- right part -->
                             <img class="h-80 w-76 md:h-64 md:w-56" src="Screenshot 2026-03-12 151722.png" alt="this is image">
                        </div>
                    </div>
                    <div class="text-black ml-12 md:ml-6 mr-6 mt-18 md:mt-5 mb-10 flex justify-center">
                        <button id="restart-btn" class="bg-yellow-300 py-2 px-6 text-black font-semibold rounded-md hover:cursor-pointer shadow-2xl hover:shadow-yellow-200 transition-all duration-300 ease-in-out hover:-translate-y-1">
                            <p class="text-3xl md:text-lg px-10 py-3">RESTART QUIZ</p>
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="script2.js"></script>
</body>
</html>
